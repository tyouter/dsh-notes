url: https://github.com/tyouter/dsh-notes
name: tyouter/dsh-notes
category: ui
description:
  en: 'A notebook inside DeepSeek Harness: one page, typeset as you type. Two spaces make a bullet, four the next level; a one-second pause brings a suggestion that TAB accepts and one Backspace removes; Structure and Translate work on a draft that only lands when you apply it; History edits in place and copies standard Markdown; the board answers questions from the notebook with its own query tools.'
  zh: 'DeepSeek Harness 里的笔记本：一页纸，边写边排版。两个空格是项目符号、四个空格是下一级；停一秒出现建议，TAB 采纳、一次 Backspace 收回；结构化与翻译只写成草稿，应用后才落进正文；历史页就地编辑并可复制标准 Markdown；看板用只读查询工具回答关于笔记的问题。'
