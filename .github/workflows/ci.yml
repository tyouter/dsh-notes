name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No dependencies to install: every suite runs on node: built-ins, and
      # `npm test` rebuilds client.js first so a stale bundle cannot pass.
      - run: npm test
