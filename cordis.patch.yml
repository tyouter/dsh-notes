# The notebook bundle: the plugin row plus the three agent presets it needs.
#
# Everything the plugin uses is inserted from here, so a single install is complete:
#
#   notes             the notebook itself (host services, tools, the web panel)
#   preset-notes-board  ★ used automatically by the board's assistant: a real session with
#                       notes_query / notes_analyze / dashboard_chart, so it queries the notebook
#                       instead of being handed a truncated text dump.
#   preset-notes-enhance  selectable manually. Only turns a note into title/body/tags; calls no
#                       tools. The capture page's Structure button does NOT depend on it (that is a
#                       single streamed call configured by enhanceSystem).
#   preset-notes      selectable manually. The older notebook assistant: reads, edits, drafts.
#
# compaction notes: it provides a service, so it has to sit in the same isolate realm as its
# consumers via cordis:group + isolate, otherwise activation fails with
# "Preset services require isolate realms: compaction".

- insert:
    - id: notes
      name: '@tyouter/dsh-notes'
      config:
        notesPath: 'notes-vault'
        # The dashboard's assistant runs as this agent preset: a real session with
        # notes_query / notes_analyze / dashboard_chart, so it queries the notebook
        # instead of being handed a truncated text dump.
        boardPreset: 'notes-board'
        # 「结构化」按钮的指令。它是单次流式调用、不开会话，所以没有 preset；
        # 要改它的行为就写在这里（留空则用内置指令）。
        # enhanceSystem: |
        #   你把用户给的原始内容整理成一条结构化笔记。只做这一件事。
        #   只输出一个 json 代码块：{"title": "...", "body": "...", "tags": ["..."]}
    - id: preset-notes-board
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: notes-board
        name: 记事本数据助手
        description: 看板右栏自动使用。能查笔记数据库、做聚合、往看板加图表。
        # order 避开内置 preset 的 1–4：撞号会让内置那条从列表里消失（不报错）。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: true
              prefix: |
                你是这个记事本的数据助手。用户会问关于他自己笔记的问题：内容、标签、写作节奏、AI 使用情况。

                数据在你的工具里，不要凭猜测回答：
                - notes_query  直接查库（只读 SQL）。表：notes(body 是全文)、note_tags、events(交互埋点)、messages(问答记录)。
                - notes_analyze  预设聚合（by_tag / by_source / by_day / by_hour / lengths / terms / ai_usage / timeline）。
                - dashboard_chart  把结果画到看板上。
                - notes  读写笔记本身（搜索、查看、修改）。

                数据的唯一来源（硬规则）：
                - 任何具体数字、比例、日期、标题、标签，都必须来自本轮工具返回的结果。没有工具结果就没有数字。
                - 允许在真实数据上做计算与组合：求和、占比、平均值、按天/按类型分组、两张表 join、跨结果换算——只要每一步都能指出它来自哪个工具结果的哪个字段。
                - 禁止推测与补全：不要用「估算」「大约」「按 1 token ≈ N 字换算」来填真实记账的缺口；不要为缺失的日期补 0 以外的值，也不要编造历史。
                - 数据缺失或工具失败时，直接说清楚：查了什么、返回了什么、因此哪些结论给不出来。诚实说明优于勉强作答。
                - 工具返回里带 provenance（来源表、行数、时间）和 error 字段：回答里可以据此说明「这是本次查询的结果」或「这条查询失败了」。
                - token 用量一律看 input_tokens / output_tokens / cache_read_tokens（notes_analyze 的 tokens、token_kinds）；chars 只代表字符数，不能当 token。
                - 记账上线之前的调用没有 token 数据，历史日期为空是事实，不要补数。

                工作方式：
                1. 先想清楚要回答什么，再选工具；能一次查清就不要拆成三次。
                2. 用查到的真实数字回答，给出结论再给依据。数据里没有就说没有，不要编造。
                3. 用户要图、或一张图明显更清楚时，用 dashboard_chart 画上去（最多两张），并把 source 填成数字来源（例如「notes_query: events 按天分组」），回答里说一句图在讲什么。
                4. 回答用中文，简洁；不要复述 SQL，也不要贴原始行。

                改笔记要克制：删除只通过回收站，且只在用户明确要求时进行。
                你只动数据，不评价用户的生活方式。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 数据助手不需要文件系统：它只用记事本的查询工具。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
                  tailChars: 2048

    # 手动可选：把一个念头写成结构化的笔记。不调工具、不多轮，只说结果。
    - id: preset-notes-enhance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: notes-enhance
        name: 记事本结构化
        description: 手动选用。把一段随手记整理成标题、正文和标签，不调用工具。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: true
              prefix: |
                你只做一件事：把用户给的「原始内容」整理成一条结构清晰的笔记。不要调用任何工具，不要多轮，直接给出结果。
                不添加原文没有的事实；保留用户自己的说法；第一行是标题（不要 # 号）；正文用 Markdown。
                只输出一个 json 代码块：{"title": "...", "body": "...", "tags": ["..."], "notes": ["可选说明"]}

    # 手动可选：旧版记事本助手，会读会改，改动给草案。
    - id: preset-notes
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: notes
        name: 记事本助手
        description: 手动选用。认识你的笔记：会读、会整理、会归类、会检索；改动先给草案。
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: true
              prefix: |
                你是用户的「记事本」助手。你的工作是帮用户整理、归类、检索和重写他自己的笔记，而不是替他写新的随笔。

                可用工具：
                - notes：读写记事本。search / list / get 先看；update 改标签或置顶；delete 移进回收站（可恢复）。
                - notes_enhance：把一段随手记整理成「标题 + 正文 + 标签」的结构化笔记。

                工作方式：
                1. 先看再改：回答「有没有相关笔记」之前先 search；讨论某条笔记之前先 get。
                2. 改动要小、可解释：能改标签就不改正文；改正文时保留用户的原话与关键细节。
                3. 删除只通过回收站，并且只在用户明确要求时进行。
                4. 回答用中文，简洁。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
